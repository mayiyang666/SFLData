fixed:
  seed: 42
  input_size: 1024
  epochs: 150
  num_workers: 8
  pin_memory: true
  amp: true
  grad_clip_norm: 0.1
  augmentation:
    random_horizontal_flip: 0.5
    random_vertical_flip: 0.5
    random_rotate90: 0.5
    photometric:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
  val_augmentation: none
model_specific:
  - learning_rate
  - batch_size
  - optimizer
  - weight_decay
  - lr_scheduler
  - backbone
evaluation:
  backend: pycocotools
  interval: 1
  ckpt_interval: 10
  keep_results: all
  conf_threshold: 0.001
  nms_iou_threshold: 0.6
  max_dets: [100, 300, 1000]
  iou_thresholds: "0.50:0.05:0.95"
  area_ranges:
    all: [0, 1e10]
    small: [0, 32768]
    medium: [32768, 98304]
    large: [98304, 1e10]
  report_metrics:
    instance: [mAP, mAP_50, mAP_75, mAP_small, mAP_medium, mAP_large, AR_100]
    semantic: [mIoU, OA, mean_Precision, mean_Recall, mean_F1]
